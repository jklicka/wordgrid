<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Must match the manifest's theme_color, or iOS shows a seam between the
         status bar and the app on the home-screen install. -->
    <meta name="theme-color" content="#141824" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WordGrid" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta
      name="description"
      content="Solve words from a letter wheel and learn what they mean. Every word you find adds to your vocabulary."
    />
    <title>WordGrid</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
